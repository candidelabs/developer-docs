<svg xmlns="http://www.w3.org/2000/svg" viewBox="98 78 764 430" fill="none" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F1EDE7" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#dots)"/>
  <!-- source chains -->
  <g font-size="19" fill="#F1EDE7">
    <rect x="130" y="108" width="150" height="48" rx="24" fill="#000" stroke="#F1EDE7" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="205" y="138" text-anchor="middle">Ethereum</text>
    <rect x="130" y="196" width="150" height="48" rx="24" fill="#000" stroke="#F1EDE7" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="205" y="226" text-anchor="middle">Arbitrum</text>
    <rect x="130" y="284" width="150" height="48" rx="24" fill="#000" stroke="#F1EDE7" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="205" y="314" text-anchor="middle">Base</text>
    <rect x="130" y="372" width="150" height="48" rx="24" fill="#000" stroke="#F1EDE7" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="205" y="402" text-anchor="middle">Optimism</text>
  </g>
  <!-- routes -->
  <g stroke="#F1EDE7" stroke-opacity="0.3" stroke-width="1.5">
    <path d="M280 132C380 132 380 264 450 264"/>
    <path d="M280 220C380 220 380 264 450 264"/>
    <path d="M280 308C380 308 380 264 450 264"/>
    <path d="M280 396C380 396 380 264 450 264"/>
  </g>
  <!-- the one deposit address -->
  <rect x="450" y="232" width="220" height="64" rx="16" fill="#000" stroke="#E70073" stroke-width="2"/>
  <text x="560" y="258" text-anchor="middle" fill="#888" font-size="15">Deposit address</text>
  <text x="560" y="281" text-anchor="middle" fill="#F599C2" font-size="20" font-weight="600">0x36af…cd02</text>
  <path d="M670 264H740" stroke="#E70073" stroke-width="2"/>
  <path d="M732 256l8 8-8 8" stroke="#E70073" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- destination wallet -->
  <rect x="750" y="224" width="100" height="80" rx="16" fill="#000" stroke="#F1EDE7" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="800" y="258" text-anchor="middle" fill="#F1EDE7" font-size="19" font-weight="600">Wallet</text>
  <text x="800" y="280" text-anchor="middle" fill="#888" font-size="17">on Base</text>
</svg>
